# BankOps AI — local stack.
# Requires Docker. Secrets come from .env (see .env.example); nothing is committed.

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: bankops-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-bankops}
      POSTGRES_USER: ${POSTGRES_USER:-bankops}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    ports:
      - "${POSTGRES_PORT:-5434}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infrastructure/postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bankops} -d ${POSTGRES_DB:-bankops}"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [bankops]

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.1
    container_name: bankops-keycloak
    command: ["start-dev", "--import-realm", "--http-port=8080", "--health-enabled=true"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?set KEYCLOAK_ADMIN_PASSWORD in .env}
      KC_HEALTH_ENABLED: "true"
    ports:
      - "${KEYCLOAK_PORT:-8180}:8080"
    volumes:
      - ./infrastructure/keycloak/realm-bankops.json:/opt/keycloak/data/import/realm-bankops.json:ro
    healthcheck:
      # The keycloak image has no curl; probe the management port with bash.
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && echo -e 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && cat <&3 | grep -q 'UP'"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    networks: [bankops]

  minio:
    image: cgr.dev/chainguard/minio:latest
    container_name: bankops-minio
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-bankops}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - miniodata:/data
    # Distroless image: no shell healthcheck. Uploads fail with 503 until ready;
    # queued processing retries transient failures with fenced leases.
    networks: [bankops]

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: bankops-backend
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-local}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-bankops}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-bankops}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      BANKOPS_SECURITY_ISSUER_URI: ${OIDC_ISSUER_URI:-http://localhost:8180/realms/bankops}
      BANKOPS_SECURITY_JWK_SET_URI: http://keycloak:8080/realms/bankops/protocol/openid-connect/certs
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-bankops}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env}
      MINIO_BUCKET: ${MINIO_BUCKET:-bankops-documents}
      AI_PROVIDER: ${AI_PROVIDER:-mock}
      BANKOPS_SECURITY_AUDIENCE: ${OIDC_AUDIENCE:-bankops-api}
      BANKOPS_CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:4200}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    depends_on:
      minio:
        condition: service_started
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 40s
    networks: [bankops]

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NG_OIDC_AUTHORITY: ${OIDC_ISSUER_URI:-http://localhost:8180/realms/bankops}
        NG_OIDC_CLIENT_ID: bankops-frontend
        NG_API_BASE_URL: http://localhost:8080/api/v1
    container_name: bankops-frontend
    ports:
      - "${FRONTEND_PORT:-4200}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ | grep -qi bankops"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [bankops]

volumes:
  pgdata:
  miniodata:

networks:
  bankops:
    driver: bridge
