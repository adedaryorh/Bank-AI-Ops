name: BankOps verification
on: [push, pull_request]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - run: mvn -B verify
        working-directory: backend
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-evaluation-and-test-results
          path: |
            backend/target/ai-evaluation/
            backend/target/surefire-reports/
      - run: mvn -B -P live-ai -DskipTests package
        working-directory: backend
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: npm test -- --watch=false --browsers=ChromeHeadless --reporters=progress
        working-directory: frontend

  browser-workflows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: cp .env.example .env
      - run: docker compose up --build --wait --wait-timeout 240
      - run: npm ci && npx playwright install --with-deps chromium && npm run e2e
        working-directory: frontend
      - run: docker compose logs --no-color > compose-test.log
        if: failure()
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failure-results
          path: |
            frontend/test-results/
            compose-test.log
      - run: docker compose down -v
        if: always()
