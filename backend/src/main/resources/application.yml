spring:
  servlet:
    multipart:
      max-file-size: 1MB
      max-request-size: 1100KB
  application:
    name: bankops
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5434/bankops}
    username: ${SPRING_DATASOURCE_USERNAME:bankops}
    password: ${SPRING_DATASOURCE_PASSWORD:bankops-local}
    hikari:
      maximum-pool-size: 10
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    default-property-inclusion: non_null

server:
  port: ${BACKEND_PORT:8080}
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when_authorized
      probes:
        enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

bankops:
  storage:
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    access-key: ${MINIO_ROOT_USER:}
    secret-key: ${MINIO_ROOT_PASSWORD:}
    bucket: ${MINIO_BUCKET:bankops-documents}
  jobs:
    enabled: ${DOCUMENT_JOBS_ENABLED:true}
  ai:
    provider: ${AI_PROVIDER:mock}
  security:
    audience: ${OIDC_AUDIENCE:bankops-api}
    issuer-uri: ${OIDC_ISSUER_URI:http://localhost:8180/realms/bankops}
    jwk-set-uri: ${OIDC_JWK_SET_URI:}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://127.0.0.1:4200}
  notice: "Synthetic data only. Decision support, not a production or legally compliant system."

logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%X{correlationId:-}] %logger{36} - %msg%n"
  level:
    root: INFO
    com.bankops: INFO
    org.springframework.security: INFO
